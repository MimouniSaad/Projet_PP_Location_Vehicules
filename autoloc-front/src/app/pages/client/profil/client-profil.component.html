<div class="page">
  <div class="page-header">
    <p class="breadcrumb">Mon profil</p>
    <h1>Mon profil</h1>
  </div>

  <div class="card" style="max-width:600px">
    <div style="display:flex;align-items:center;gap:20px;margin-bottom:28px">
      <div style="width:72px;height:72px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff">
        {{ auth.initials }}
      </div>
      <div>
        <div style="font-size:20px;font-weight:700">{{ auth.fullName }}</div>
        <div style="color:var(--text-muted);font-size:14px">{{ auth.currentUser?.email }}</div>
        <div style="font-size:12px;margin-top:4px"><span class="badge badge-info">Client</span></div>
      </div>
    </div>

    <div *ngIf="success" style="background:rgba(34,197,94,0.1);color:var(--success);padding:12px 16px;border-radius:8px;margin-bottom:16px">{{ success }}</div>
    <div *ngIf="error" class="error-msg" style="margin-bottom:16px">{{ error }}</div>

    <div *ngIf="!editMode">
      <div class="form-group">
        <label>Prénom</label>
        <div style="padding:10px 14px;background:var(--bg-card);border-radius:8px;border:1px solid var(--border)">{{ form.firstname || '—' }}</div>
      </div>
      <div class="form-group">
        <label>Nom</label>
        <div style="padding:10px 14px;background:var(--bg-card);border-radius:8px;border:1px solid var(--border)">{{ form.lastname || '—' }}</div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <div style="padding:10px 14px;background:var(--bg-card);border-radius:8px;border:1px solid var(--border)">{{ form.email || '—' }}</div>
      </div>
      <button class="btn btn-primary" (click)="editMode = true">Modifier</button>
    </div>

    <div *ngIf="editMode">
      <div class="form-group">
        <label>Prénom</label>
        <input type="text" [(ngModel)]="form.firstname">
      </div>
      <div class="form-group">
        <label>Nom</label>
        <input type="text" [(ngModel)]="form.lastname">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="form.email">
      </div>
      <div style="display:flex;gap:12px">
        <button class="btn btn-primary" (click)="sauvegarder()" [disabled]="loading">
          {{ loading ? 'Enregistrement...' : 'Enregistrer' }}
        </button>
        <button class="btn" (click)="annuler()">Annuler</button>
      </div>
    </div>
  </div>
</div>
