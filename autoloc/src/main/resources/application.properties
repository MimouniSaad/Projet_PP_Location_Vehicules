spring.application.name=autoloc
# JWT
jwt.secret=autoloc_secret_key_very_long_and_secure_must_be_32_chars
jwt.expiration=86400000

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/autoloc?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=test
spring.datasource.password=test

#spring.datasource.url=jdbc:mysql://localhost:3306/autoloc?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
#spring.datasource.username=root
#spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#jjk
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
#jjk
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=false